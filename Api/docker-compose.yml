name: prolink

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prolink
      POSTGRES_PASSWORD: prolink
      POSTGRES_DB: prolink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolink -d prolink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: prolink-api:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://prolink:prolink@db:5432/prolink
      TEST_DATABASE_URL: postgresql+psycopg2://prolink:prolink@db:5432/prolink_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
