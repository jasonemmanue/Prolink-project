# Config-as-code Railway — service « backoffice » (Next.js 14).
# Lue automatiquement par `railway up backoffice --path-as-root --service backoffice`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
